# CloudPanel: use host MySQL, host Redis, and host Nginx (no redis/nginx containers).
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.cloudpanel.yml --profile prod up -d
#
# Point CloudPanel vhost to 127.0.0.1:6001 (frontend) and /api → 127.0.0.1:6002 (backend).
# See docker/cloudpanel/vhost.conf.example

services:
  redis:
    profiles: [cloudpanel-skip-redis]

  nginx:
    profiles: [cloudpanel-skip-nginx]

  backend:
    network_mode: host
    depends_on: []
    ports: []
    environment:
      DOCKER_USE_HOST_NETWORK: "true"
      REDIS_URL: redis://127.0.0.1:6379/0
      RECOGNITION_SERVICE_URL: http://127.0.0.1:6003

  backend-worker:
    network_mode: host
    depends_on: []
    environment:
      DOCKER_USE_HOST_NETWORK: "true"
      REDIS_URL: redis://127.0.0.1:6379/0

  recognition:
    ports:
      - "127.0.0.1:6003:6003"

  frontend:
    ports:
      - "127.0.0.1:6001:6001"
    depends_on: []

  prometheus:
    ports: []
    expose:
      - "9090"

  grafana:
    ports: []
    expose:
      - "3000"
