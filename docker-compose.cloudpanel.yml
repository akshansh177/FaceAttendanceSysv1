# CloudPanel: host MySQL, Redis, and Nginx — only run the 4 app containers.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.cloudpanel.yml --profile prod up -d
#
# CloudPanel vhost: docker/cloudpanel/vhost.conf.example
#   /     → http://127.0.0.1:6001
#   /api/ → http://127.0.0.1:6002

services:
  redis:
    profiles: [cloudpanel-skip]

  nginx:
    profiles: [cloudpanel-skip]

  prometheus:
    profiles: [cloudpanel-skip]

  grafana:
    profiles: [cloudpanel-skip]

  backend:
    network_mode: host
    depends_on: []
    ports: []
    environment:
      DOCKER_USE_HOST_NETWORK: "true"
      REDIS_URL: redis://127.0.0.1:6379/0
      RECOGNITION_SERVICE_URL: http://127.0.0.1:6003

  backend-worker:
    network_mode: host
    depends_on: []
    environment:
      DOCKER_USE_HOST_NETWORK: "true"
      REDIS_URL: redis://127.0.0.1:6379/0

  recognition:
    ports:
      - "127.0.0.1:6003:6003"

  frontend:
    ports:
      - "127.0.0.1:6001:6001"
    depends_on: []
