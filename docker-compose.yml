# CloudPanel deploy: only 4 app containers (host MySQL, Redis, Nginx).
# Usage: ./scripts/compose-prod.sh up -d --build

services:
  backend:
    build: ./apps/backend
    network_mode: host
    env_file: ./apps/backend/.env
    environment:
      REDIS_URL: redis://127.0.0.1:6379/0
      RECOGNITION_SERVICE_URL: http://127.0.0.1:6003
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

  backend-worker:
    build: ./apps/backend
    network_mode: host
    env_file: ./apps/backend/.env
    environment:
      REDIS_URL: redis://127.0.0.1:6379/0
    command: ["python", "-m", "app.worker"]
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

  recognition:
    build: ./apps/recognition-service
    ports:
      - "127.0.0.1:6003:6003"
    restart: unless-stopped

  frontend:
    build:
      context: ./apps/frontend
      args:
        # Empty = same-origin /api via CloudPanel Nginx (recommended)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    environment:
      PORT: "6001"
    ports:
      - "127.0.0.1:6001:6001"
    restart: unless-stopped

volumes:
  uploads_data:
